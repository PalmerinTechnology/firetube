[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
googleServices = "4.5.0"
crashlyticsPlugin = "3.0.8"

compileSdk = "37"
targetSdk = "36"
minSdk = "26"

newpipeExtractor = "v0.26.5"
okhttp = "5.5.0"
desugar = "2.1.5"
coroutines = "1.11.0"
serializationJson = "1.11.0"

coreKtx = "1.19.1"
